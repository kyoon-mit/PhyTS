[project]
name = "timeseriesphysics-foundation"
version = "0.1.0"
description = "Foundation-model benchmarking env for TimeSeriesPhysics (Python 3.10, torch 2.4.1)."
# Pinned to 3.10 because several pretrained models (uni2ts, timesfm, lag-llama,
# momentfm) ship with deps that only resolve on 3.10. Do not bump without
# re-validating every wrapper in wrappers/.
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch==2.4.1",
    "numpy==1.26.4",
    "pandas==2.1.4",
    "einops==0.7.0",
    "h5py",
    "wandb",
    "pyyaml",
    "jsonargparse[all]",
    "matplotlib",
    # Foundation models
    "momentfm",
    "chronos-forecasting",
    "timesfm==1.3.0",
    "transformers==4.44.2",
    "accelerate==1.13.0",
    "uni2ts==2.0.0",
    "lag-llama",
    # lag-llama imports pkg_resources, removed in setuptools>=72
    "setuptools<72",
]

[tool.uv]
# Virtual project: declares deps, is not itself built or installed.
package = false
# momentfm hard-pins transformers==4.33.3, but chronos / timesfm / uni2ts all
# need 4.44.2. Override the resolver so the whole graph uses our chosen pin.
# Matches the effective behaviour of the old pip install (which ignored
# momentfm's pin via install ordering).
override-dependencies = [
    "transformers==4.44.2",
    "numpy==1.26.4",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
lag-llama = { git = "https://github.com/time-series-foundation-models/lag-llama.git" }
