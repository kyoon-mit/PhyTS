[project]
name = "tsp-foundation"
version = "0.1.0"
requires-python = "==3.10.*"
dependencies = [
    "torch==2.4.1",
    "numpy==1.26.4",
    "pandas==2.1.4",
    "einops==0.7.0",
    "h5py",
    "wandb",
    "pyyaml",
    "jsonargparse[all]",
    "matplotlib",
    "momentfm",
    "chronos-forecasting",
    "timesfm==1.3.0",
    "transformers==4.44.2",
    "accelerate==1.13.0",
    "uni2ts==2.0.0",
    "lag-llama",
    "setuptools<72",  # restores pkg_resources needed by lag-llama
]

[tool.uv.sources]
lag-llama = { git = "https://github.com/time-series-foundation-models/lag-llama.git" }

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
