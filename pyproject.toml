[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "TimeSeriesPhysics"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.16.0",
    "jaxtyping>=0.3.9",
    "jsonargparse[signatures]>=4.48.0",
    "lightning>=2.6.1",
    "wandb>=0.26.0",
]

[project.optional-dependencies]
# Pick exactly one of cpu / cu129 — they are mutually exclusive (see tool.uv.conflicts).
# Local / laptop:           uv sync --extra cpu
# GPU cluster (CUDA 12.x):  uv sync --extra cu129 [--extra jax]
cpu = ["torch>=2.11.0"]
cu129 = ["torch>=2.11.0", "jax[cuda12]>=0.7.2"]
# Pure-Python JAX stack (CPU or layered on top of cu129). Safe to combine with either wheel choice.
jax = ["equinox>=0.13.2", "jax>=0.7.2", "optax>=0.2.8"]

[dependency-groups]
# add any extra dependencies for development here, e.g. linters, formatters, type checkers, etc. here
dev = ["ruff>=0.6.0"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu129" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu129", extra = "cu129" },
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["C", "E", "F", "I", "W", "D", "N"]
ignore = [
    "E741",
    "W605",
    "C408",
    "E402",
    "F722",
    "N806",
    "N803",
    "D107",
    "N812",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
