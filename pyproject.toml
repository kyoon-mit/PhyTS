[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "TimeSeriesPhysics"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.16.0",
    "jaxtyping>=0.3.9",
    "jsonargparse[signatures]>=4.48.0",
    "lightning>=2.6.1",
    "torch>=2.11.0",
    "wandb>=0.26.0",
]

[project.optional-dependencies]
jax = [
    "optax>=0.2.8",
    "equinox>=0.13.2",
    "jax>=0.7.2",
]
cu12 = ["jax[cuda12]>=0.7.2"]


[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["C", "E", "F", "I", "W", "D", "N"]
ignore = ["E741", "W605", "C408", "E402", "F722", "N806", "N803", "D107", "N812"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
