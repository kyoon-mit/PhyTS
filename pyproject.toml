[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "TimeSeriesPhysics"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "einops>=0.7.0",
    "h5py>=3.16.0",
    "jaxtyping>=0.3.9",
    "jsonargparse[signatures]>=4.48.0",
    "lightning>=2.6.1",
    "matplotlib>=3.8.0",
    "pyarrow>=16.0.0",
    "torch>=2.11.0",
    "tqdm>=4.66.0",
    "wandb>=0.26.0",
]

[project.optional-dependencies]
jax = [
    "optax>=0.2.8",
    "equinox>=0.13.2",
    "huggingface_hub>=0.20.0",
    "jax>=0.7.2",
]
# GPU JAX: use together with the ``jax`` extra, e.g.
#   uv sync --extra jax --extra cu12
# Pick ``cu12`` (driver >= 525) or ``cu13`` (>= 580); see https://docs.jax.dev/en/latest/installation.html
cu12 = ["jax[cuda12]>=0.7.2"]
cu13 = ["jax[cuda13]>=0.7.2"]


[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["C", "E", "F", "I", "W", "D", "N"]
ignore = [
    "E741",
    "W605",
    "C408",
    "E402",
    "F722",
    "N806",
    "N803",
    "D107",
    "N812",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
