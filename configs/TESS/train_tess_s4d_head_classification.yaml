# Frozen S4D backbone + MLP classification head: TESS flux → label.
# Requires: checkpoints/tess_s4d_reconstruction/best.ckpt (train reconstruction first).
#
# Before running: determine num_classes (see train_tess_mlp_classification.yaml).
#
# Usage: python main.py fit --config configs/TESS/train_tess_s4d_head_classification.yaml

trainer:
  max_epochs: 200
  accelerator: gpu
  devices: 1
  log_every_n_steps: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        mode: min
        patience: 20
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/tess_s4d_head_classification
        filename: best
        monitor: val/loss
        mode: min
        save_top_k: 1
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: TimeSeriesPhysics
      name: tess_s4d_head_classification

model:
  class_path: tasks.TESS.tess_classification.TESSFrozenBackboneClassificationCE
  init_args:
    backbone_ckpt: checkpoints/tess_s4d_reconstruction/best.ckpt
    backbone_cfg: configs/TESS/train_tess_s4d_reconstruction.yaml
    num_classes: 8   # APERIODIC, CONTACT_ROT, DSCT_BCEP, ECLIPSE, GDOR_SPB, INSTRUMENT/JUNK, RRLYR_CEPH, SOLARLIKE
    lr: 1.0e-3
    lr_decay: 0.99
    head:
      class_path: models.mlp.MLPRegressor
      init_args:
        seq_len: 1100
        d_output: 8
        hidden_dims: [256, 128, 64]
        dropout: 0.1

data:
  class_path: dataloader.tess_dataloader.TESSClassificationDataModule
  init_args:
    data_dir: data/TESS/.cache/TESS
    batch_size: 64
    num_workers: 8
    seq_len: 1100
