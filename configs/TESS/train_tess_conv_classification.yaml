# Usage: python main.py fit --config configs/TESS/train_tess_conv_classification.yaml

trainer:
  max_epochs: 100
  accelerator: gpu
  devices: 1
  log_every_n_steps: 1
  gradient_clip_val: 1.0
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        mode: min
        patience: 15
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/tess_conv_classification
        filename: best
        monitor: val/loss
        mode: min
        save_top_k: 1
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: logs
      name: tess_conv_classification

model:
  class_path: tasks.TESS.classification.TESSClassification
  init_args:
    lr: 1.0e-4
    lr_decay: 0.995
    weight_decay: 1.0e-4
    use_mask: true
    model:
      class_path: models.conv.ConvClassifier
      init_args:
        d_input: 1
        d_output: 8
        channels: [64, 64, 128, 128, 256]
        kernel_size: 15
        dropout: 0.4

data:
  class_path: dataloader.tess_dataloader.TESSDataModule
  init_args:
    data_path: data/TESS/tess_classification.parquet
    seq_len: 3917
    batch_size: 64
    num_workers: 4
    train_frac: 0.7
    val_frac: 0.15
    seed: 42
