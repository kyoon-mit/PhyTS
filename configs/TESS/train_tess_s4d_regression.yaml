# S4D end-to-end regression: TESS flux → frot (rotation frequency).
#
# Usage: python main.py fit --config configs/TESS/train_tess_s4d_regression.yaml

trainer:
  max_epochs: 200
  accelerator: gpu
  devices: 1
  log_every_n_steps: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        mode: min
        patience: 20
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/tess_s4d_regression
        filename: best
        monitor: val/loss
        mode: min
        save_top_k: 1
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: TimeSeriesPhysics
      name: tess_s4d_regression

model:
  class_path: tasks.TESS.tess_regression.TESSRegressionMSE
  init_args:
    lr: 1.0e-3
    lr_decay: 0.99
    model:
      class_path: models.s4d.S4Model
      init_args:
        d_input: 1
        d_output: 1
        d_model: 256
        d_state: 64
        n_layers: 4
        dropout: 0.1

data:
  class_path: dataloader.tess_dataloader.TESSRegressionDataModule
  init_args:
    data_dir: data/TESS/.cache/TESS
    batch_size: 64
    num_workers: 8
    seq_len: 1100
