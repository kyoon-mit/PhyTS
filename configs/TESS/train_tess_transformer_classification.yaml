# Usage: python main.py fit --config configs/TESS/train_tess_transformer_classification.yaml
# Multi-class classification of TESS light curves using a Transformer encoder.

trainer:
  max_epochs: 100
  accelerator: gpu
  devices: 1
  log_every_n_steps: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        mode: min
        patience: 10
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/tess_transformer_classification
        filename: best
        monitor: val/loss
        mode: min
        save_top_k: 1

model:
  class_path: tasks.TESS.classification.TESSClassification
  init_args:
    lr: 1.0e-4
    lr_decay: 0.995
    weight_decay: 1.0e-4
    use_mask: true
    model:
      class_path: models.transformer.TransformerModel
      init_args:
        d_input: 1
        d_output: 8
        d_model: 64
        n_heads: 4
        n_layers: 4
        d_ff: 256
        dropout: 0.1
        max_len: 4096

data:
  class_path: dataloader.tess_dataloader.TESSDataModule
  init_args:
    data_path: data/TESS/tess_classification.parquet
    seq_len: 3917
    batch_size: 64
    num_workers: 4
    train_frac: 0.7
    val_frac: 0.15
    seed: 42
