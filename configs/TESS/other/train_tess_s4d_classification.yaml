# S4D end-to-end classification: TESS flux → variability class label.
#
# Before running: determine num_classes (see train_tess_mlp_classification.yaml).
#
# Usage: python main.py fit --config configs/TESS/other/train_tess_s4d_classification.yaml

trainer:
  max_epochs: 200
  accelerator: gpu
  devices: 1
  log_every_n_steps: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        mode: min
        patience: 20
    - class_path: tasks.TESS.pytorch_checkpoint.TESSPyTorchModelCheckpoint
      init_args:
        dirpath: checkpoints/tess_s4d_classification
        filename: best
        monitor: val/loss
        mode: min
        save_top_k: 1
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: TimeSeriesPhysics
      name: tess_s4d_classification

model:
  class_path: tasks.TESS.tess_classification.TESSClassificationCE
  init_args:
    num_classes: 8   # APERIODIC, CONTACT_ROT, DSCT_BCEP, ECLIPSE, GDOR_SPB, INSTRUMENT/JUNK, RRLYR_CEPH, SOLARLIKE
    lr: 1.0e-3
    lr_decay: 0.99
    model:
      class_path: models.s4d.S4Model
      init_args:
        d_input: 1
        d_output: 8
        d_model: 256
        d_state: 64
        n_layers: 4
        dropout: 0.1

data:
  class_path: dataloader.tess_dataloader.TESSClassificationDataModule
  init_args:
    data_dir: data/TESS/.cache/TESS
    batch_size: 64
    num_workers: 8
    seq_len: 1100
