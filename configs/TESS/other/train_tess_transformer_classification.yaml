# Transformer end-to-end classification: TESS flux -> variability class label.

# Usage: python main.py fit --config configs/TESS/other/train_tess_transformer_classification.yaml

trainer:
  max_epochs: 200
  accelerator: gpu
  devices: 1
  log_every_n_steps: 10
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        mode: min
        patience: 20
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/tess_transformer_classification
        filename: best
        monitor: val/loss
        mode: min
        save_top_k: 1
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: TimeSeriesPhysics
      name: tess_transformer_classification

model:
  class_path: tasks.TESS.tess_classification.TESSClassificationCE
  init_args:
    num_classes: 8
    lr: 1.0e-3
    lr_decay: 0.99
    model:
      class_path: models.transformer.TransformerClassifier
      init_args:
        seq_len: 1100
        d_output: 8
        d_model: 128
        nhead: 4
        num_layers: 4
        dim_feedforward: 256
        dropout: 0.1

data:
  class_path: dataloader.tess_dataloader.TESSClassificationDataModule
  init_args:
    data_dir: data/TESS/.cache/TESS
    batch_size: 64
    num_workers: 8
    seq_len: 1100