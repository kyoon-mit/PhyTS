# wandb sweep config — MLP end-to-end classification
#
# Create sweep:
#   wandb sweep configs/TESS/sweep/sweep_cls_mlp.yaml --project TimeSeriesPhysics
# Launch agents:
#   bash benchmarks/TESS/run_sweep.sh --model_type mlp --sweep_id <id>

program: benchmarks/TESS/sweep_classification.py
command:
  - ${env}
  - python
  - ${program}
  - --model_type=mlp
  - ${args}

method: bayes
metric:
  name: val/balanced_acc
  goal: maximize

early_terminate:
  type: hyperband
  min_iter: 10
  eta: 3

parameters:
  size:
    values: [xs, sm, md, lg]
  lr:
    distribution: log_uniform_values
    min: 0.00005
    max: 0.01
  dropout:
    distribution: uniform
    min: 0.0
    max: 0.5
  weight_decay:
    distribution: log_uniform_values
    min: 0.000001
    max: 0.01
  batch_size:
    values: [32, 64, 128]
  seed:
    values: [0, 1, 2]
