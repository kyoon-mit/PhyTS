# wandb sweep config — LinOSS-IMEX end-to-end regression (JAX/Equinox)
#
# Requires the jax extra:
#   uv sync --extra jax --extra cu13
#
# Create sweep:
#   wandb sweep configs/TESS/sweep/sweep_reg_linoss_imex.yaml --project TimeSeriesPhysics
# Launch agents:
#   bash benchmarks/TESS/run_sweep.sh --model_type linoss_imex --sweep_id <id>

program: benchmarks/TESS/sweep_regression.py
command:
  - ${env}
  - python
  - ${program}
  - --model_type=linoss_imex
  - ${args}

method: bayes
metric:
  name: val/r2
  goal: maximize

early_terminate:
  type: hyperband
  min_iter: 10
  eta: 3

parameters:
  size:
    values: [xs, sm, md, lg]
  lr:
    distribution: log_uniform_values
    min: 0.00005
    max: 0.005
  dropout:
    value: 0.05
  weight_decay:
    distribution: log_uniform_values
    min: 0.000001
    max: 0.01
  batch_size:
    values: [32, 64, 128]
  seed:
    values: [0, 1, 2]
