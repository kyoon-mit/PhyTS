# wandb sweep config — CNN+Attention end-to-end regression (frot prediction)
#
# Create sweep:
#   wandb sweep configs/TESS/sweep/sweep_reg_cnn_attn.yaml --project TimeSeriesPhysics
# Launch agents:
#   bash benchmarks/TESS/run_sweep.sh --model_type cnn_attn --sweep_id <id>

program: benchmarks/TESS/sweep_regression.py
command:
  - ${env}
  - benchmarks/TESS/repo_python.sh
  - ${program}
  - --model_type=cnn_attn
  - ${args}

name: reg_cnn_attn
method: bayes
run_cap: 150
metric:
  name: val/r2
  goal: maximize

early_terminate:
  type: hyperband
  min_iter: 20
  eta: 3

parameters:
  size:
    values: [xs, sm, md, lg]
  lr:
    distribution: log_uniform_values
    min: 0.00005
    max: 0.02
  # Conv encoder (and decoder in AE mode) + MultiheadAttention use the same p.
  dropout:
    distribution: uniform
    min: 0.0
    max: 0.5
  weight_decay:
    distribution: log_uniform_values
    min: 0.000001
    max: 0.01
  batch_size:
    values: [128, 256, 512]
  seed:
    values: [0, 1, 2]
