# wandb sweep config — S4D end-to-end classification
#
# Create sweep:
#   wandb sweep configs/TESS/sweep/sweep_cls_s4d.yaml --project TimeSeriesPhysics
# Launch agents:
#   bash benchmarks/TESS/run_sweep.sh --model_type s4d --sweep_id <id>

program: benchmarks/TESS/sweep_classification.py
command:
  - ${env}
  - python
  - ${program}
  - --model_type=s4d
  - ${args}

name: cls_s4d
method: bayes
run_cap: 100
metric:
  name: val/balanced_acc
  goal: maximize

early_terminate:
  type: hyperband
  min_iter: 20
  eta: 3

parameters:
  size:
    values: [xs, sm, md, lg]
  lr:
    distribution: log_uniform_values
    min: 0.00005
    max: 0.02
  dropout:
    distribution: uniform
    min: 0.0
    max: 0.4
  weight_decay:
    distribution: log_uniform_values
    min: 0.000001
    max: 0.01
  batch_size:
    values: [128, 256, 512]
  seed:
    values: [0, 1, 2]
