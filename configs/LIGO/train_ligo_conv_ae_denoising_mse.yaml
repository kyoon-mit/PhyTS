# Usage: python main.py fit --config configs/LIGO/train_ligo_conv_ae_denoising_mse.yaml
# ConvAE seq2seq denoiser: noisy strain → clean template (MSE loss).
# Dataset: bns_snr_5_50_powerlaw_256Hz_80K_10K_100K, window 59-63 s (L=1024).
# Input: (B, 2, 1024) H1+L1 → model: (B, 1024, 2) → output: (B, 2, 1024).

trainer:
  max_epochs: 500
  accelerator: gpu
  devices: 1
  log_every_n_steps: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        mode: min
        patience: 20
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/ligo_conv_ae_denoising_mse
        filename: best
        monitor: val/loss
        mode: min
        save_top_k: 1
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: TimeSeriesPhysics
      name: ligo_conv_ae_denoising_mse

model:
  class_path: tasks.LIGO.denoising.DenoisingMSE
  init_args:
    lr: 1.0e-3
    lr_decay: 0.99
    model:
      class_path: models.conv_ae.ConvAE
      init_args:
        n_layers:        4
        latent_channels: 64
        kernel_size:     5
        pool_stride:     2
        d_input:         2    # H1 + L1

data:
  class_path: dataloader.LIGO_dataloader.LIGODenoisingDataModule
  init_args:
    train_file: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/ai4gw@cern/bns_snr_5_50_powerlaw_256Hz_80K_10K_100K/train/sig_combined_train.h5
    val_file:   /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/ai4gw@cern/bns_snr_5_50_powerlaw_256Hz_80K_10K_100K/val/sig_combined_val.h5
    test_file:  /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/ai4gw@cern/bns_snr_5_50_powerlaw_256Hz_80K_10K_100K/test/sig_combined_test.h5
    injected_data_key: whitened_injected
    signal_data_key:   whitened_signal
    strain_frequency:  256
    strain_duration:   64.0
    window_begin:      59.0
    window_end:        63.0
    train_batch_size:  64
    val_batch_size:    64
    test_batch_size:   64
    num_workers:       4
    shuffle:           true
