# Usage: python main.py fit --config configs/LIGO/train_ligo_linoss_regression.yaml
# Trains LinOSS (JAX/equinox) regression: injected strain (H1+L1) -> chirp_mass.
# Window: 4 s at 256 Hz (512 Hz / 2x downsample) = 1024 timesteps per sample.

trainer:
  max_epochs: 100
  accelerator: cpu # accelerator=cpu: JAX manages GPU memory directly; setting gpu here conflicts with JAX.
  devices: 1
  # val_check_interval: 100
  enable_progress_bar: false
  callbacks:
    - class_path: models.utils.callbacks.LogProgressCallback
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        mode: min
        patience: 10
    - class_path: models.utils.jax.save_model.JAXCheckpointManager
      init_args:
        dirpath: checkpoints/ligo_linoss_regression
        monitor: val/loss
        mode: min
        save_top_k: 5
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: TimeSeriesPhysics
      name: ligo_linoss_regression

model:
  class_path: tasks.LIGO.ligo_regression_jax.LinOSSLIGORegression
  init_args:
    lr: 1e-3
    seed: 0
    model:
      class_path: models.linoss.LinOSS
      init_args:
        num_blocks: 4
        N: 2 # input feature dim: H1 + L1 interferometer channels
        ssm_size: 64
        H: 128
        output_dim: 1 # number of target variables (chirp_mass)
        task: regression
        output_step: 1
        discretization: damped_IMEX
        drop_rate: 0.1
        norm_type: layer
        seed: 0

data:
  class_path: dataloader.LIGO_dataloader.LIGODataModule
  init_args:
    train_file: /fast/barmstrong/LIGO/merged/train.h5
    val_file: /fast/barmstrong/LIGO/merged/val.h5
    test_file: /fast/barmstrong/LIGO/merged/test.h5
    target_variables:
      - chirp_mass
    observed_variables:
      - snr
    injected_data_key: whitened_injected
    strain_frequency: 512
    downsample_factor: 1
    strain_duration: 32.0
    window_begin: 28.0
    window_end: 32.0
    train_batch_size: 64
    val_batch_size: 64
    test_batch_size: 64
    num_workers: 1
    shuffle: true
    persistent_workers: true
