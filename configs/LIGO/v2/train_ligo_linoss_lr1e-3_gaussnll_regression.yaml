# Usage:
#   python main.py fit  --config configs/LIGO/v2/train_ligo_linoss_lr1e-3_gaussnll_regression.yaml
#   python main.py test --config configs/LIGO/v2/train_ligo_linoss_lr1e-3_gaussnll_regression.yaml \
#                       --ckpt_path checkpoints/ligo_v2_linoss_lr1e-3_gaussnll_regression/best.ckpt
#
# LinOSS (JAX/equinox) Gaussian NLL regression: 2-channel strain 59-63 s at 2048 Hz (8192 steps) -> chirp_mass.
# accelerator: cpu — JAX manages its own GPU device via XLA.
# module load cudnn/9.10.2.21_cuda12-fasrc01 required before running.
# Original (unpatched) LinOSS, H=128, ssm_size=128 (~0.40M params): every block runs on all 8192 steps.
# AdamW weight decay 0.01, grad-norm clip 1.0, lr 1e-3, early-stopping patience 30.

seed_everything: 42

trainer:
  max_epochs: 1000
  accelerator: cpu          # JAX handles GPU directly; Lightning orchestrates on CPU
  devices: 1
  log_every_n_steps: 10
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        mode: min
        patience: 30
        min_delta: 1.0e-5
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/ligo_v2_linoss_lr1e-3_gaussnll_regression
        filename: best
        monitor: val/loss
        mode: min
        save_top_k: 1
        save_last: true
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: TimeSeriesPhysics
      name: ligo_v2_linoss_lr1e-3_gaussnll_regression

model:
  class_path: tasks.LIGO.regression_jax.LinOSSLIGOGaussNLL
  init_args:
    n_targets: 1
    lr: 1.0e-3
    lr_decay: 0.99
    weight_decay: 0.01
    clip_grad_norm: 1.0
    seed: 42
    target_names:
      - chirp_mass
    observed_names:
      - snr
    csv_out: results/LIGO/v2_linoss_lr1e-3_gaussnll_regression/test_predictions.csv
    model:
      class_path: models.linoss.LinOSS
      init_args:
        num_blocks: 4
        N: 2              # n_ifos (H1 + L1)
        ssm_size: 128
        H: 128
        output_dim: 2     # 2 * n_targets (mean + log-var for chirp_mass)
        task: regression
        output_step: 1
        discretization: damped_IMEX
        drop_rate: 0.1
        seed: 42

data:
  class_path: dataloader.LIGO_dataloader.LIGODataModule
  init_args:
    # Pre-cut 58.75-63.25 s window at 2048 Hz (data/LIGO/extract_window.py, PhyTS-bench rev a0064e5c).
    # Models see 4 s (59-63 s) shifted by up to +-0.25 s: random per item in train, fixed per sample in val/test.
    train_file: data/LIGO/2048Hz_v2/train.h5
    val_file:   data/LIGO/2048Hz_v2/val.h5
    test_file:  data/LIGO/2048Hz_v2/test.h5
    injected_data_key: whitened_injected
    target_variables:
      - chirp_mass
    observed_variables:
      - snr
    strain_frequency:  2048
    strain_duration:   4.5
    window_begin:      0.25
    window_end:        4.25
    jitter:            0.25
    train_batch_size:  64
    val_batch_size:    64
    test_batch_size:   128
    num_workers:       4
    shuffle:           true
