# Usage:
#   uv run python main.py fit  --config configs/LIGO/v2/train_ligo_conv1d_gaussnll_regression.yaml
#   uv run python main.py test --config configs/LIGO/v2/train_ligo_conv1d_gaussnll_regression.yaml \
#                              --ckpt_path checkpoints/ligo_v2_conv1d_gaussnll_regression/best.ckpt
#
# ResNet1D GaussNLL regression: 2-channel (H1+L1) strain 59-63 s at 2048 Hz (8192 steps) -> chirp_mass.
# ResNet18-lite (layers=[1,1,1,1], kernel=7) -> comparable to S4D(d_model=512, n_layers=4). ~3.85M params.
# Mirrors ml4gw ResNet1D (aframe LIGO community standard): residual blocks, GroupNorm, channels [64,128,256,512].

seed_everything: 42

trainer:
  max_epochs: 60   # fixed 60-epoch budget for every model (epochs 0-59)
  accelerator: gpu
  devices: 1
  log_every_n_steps: 10
  gradient_clip_val: 1.0
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        mode: min
        patience: 30
        min_delta: 1.0e-5
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/ligo_v2_conv1d_gaussnll_regression
        filename: best
        monitor: val/loss
        mode: min
        save_top_k: 1
    # every epoch (epochNNN.ckpt, 0-based) + last.ckpt for resuming; Lightning's save_last on the
    # monitored checkpoint above only writes last.ckpt when val/loss improves
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/ligo_v2_conv1d_gaussnll_regression
        filename: "epoch{epoch:03d}"
        auto_insert_metric_name: false
        save_top_k: -1
        save_last: true
        enable_version_counter: false
    # time slice per condor job: stop at an epoch boundary after 4 h, train_ligo_cfg.sh requeues
    - class_path: functions.job_timer.JobTimer
      init_args:
        duration: "00:04:00:00"
        marker: checkpoints/ligo_v2_conv1d_gaussnll_regression/.job_timeout
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: TimeSeriesPhysics
      name: ligo_v2_conv1d_gaussnll_regression

model:
  class_path: tasks.LIGO.regression.LIGORegressionGaussNLL
  init_args:
    target_names:
      - chirp_mass
    observed_names:
      - snr
    lr: 1.0e-3
    lr_decay: 0.99
    csv_out: results/LIGO/v2_conv1d_gaussnll_regression/test_predictions.csv
    model:
      class_path: models.conv1d_regressor.ResNet1DRegressor
      init_args:
        d_input: 2          # H1 (index 0) + L1 (index 1)
        d_output: 2         # mean + log-var for chirp_mass
        layers: [1, 1, 1, 1]
        kernel_size: 7
        dropout: 0.1

data:
  class_path: dataloader.LIGO_dataloader.LIGODataModule
  init_args:
    # Pre-cut 58.75-63.25 s window at 2048 Hz (data/LIGO/extract_window.py, PhyTS-bench rev a0064e5c).
    # Models see 4 s (59-63 s) shifted by up to +-0.25 s: random per item in train, fixed per sample in val/test.
    train_file: data/LIGO/2048Hz_v2/train.h5
    val_file:   data/LIGO/2048Hz_v2/val.h5
    test_file:  data/LIGO/2048Hz_v2/test.h5
    injected_data_key: whitened_injected
    target_variables:
      - chirp_mass
    observed_variables:
      - snr
    strain_frequency:  2048
    strain_duration:   4.5
    window_begin:      0.25
    window_end:        4.25
    jitter:            0.25
    train_batch_size:  64
    val_batch_size:    64
    test_batch_size:   128
    num_workers:       4
    shuffle:           true
