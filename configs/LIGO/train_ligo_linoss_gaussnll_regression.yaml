# Usage:
#   python main.py fit  --config configs/LIGO/train_ligo_linoss_gaussnll_regression.yaml
#   python main.py test --config configs/LIGO/train_ligo_linoss_gaussnll_regression.yaml \
#                       --ckpt_path checkpoints/ligo_linoss_gaussnll_regression/best.ckpt
#
# LinOSS Gaussian-NLL regression: 2-channel (H1+L1) strain, 4 s at 2048 Hz -> chirp_mass mean
# and variance. ~400K parameters (H=128, ssm_size=128). The SSM dynamics parameters train at
# 0.1x the learning rate without weight decay, and non-finite steps are skipped, which keeps the
# long recurrence stable.

seed_everything: 42

trainer:
  max_epochs: 60   # fixed 60-epoch budget for every model; test uses the best-val checkpoint
  accelerator: cpu          # JAX handles GPU directly; Lightning orchestrates on CPU
  devices: 1
  log_every_n_steps: 10
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        mode: min
        patience: 30
        min_delta: 1.0e-5
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/ligo_linoss_gaussnll_regression
        filename: best
        monitor: val/loss
        mode: min
        save_top_k: 1
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: TimeSeriesPhysics
      name: ligo_linoss_gaussnll_regression

model:
  class_path: tasks.LIGO.regression_jax.LinOSSLIGOGaussNLL
  init_args:
    n_targets: 1
    lr: 3.0e-4
    lr_decay: 0.99
    weight_decay: 0.01
    clip_grad_norm: 1.0
    ssm_lr_factor: 0.1      # A_diag, G_diag, steps: 0.1x LR ...
    ssm_weight_decay: 0.0   # ... and no weight decay (keeps oscillators damped)
    skip_nonfinite: true    # drop updates from batches that give NaN/inf (glitches)
    seed: 42
    target_names:
      - chirp_mass
    observed_names:
      - snr
    csv_out: results/LIGO/linoss_gaussnll_regression/test_predictions.csv
    model:
      class_path: models.linoss.LinOSS
      init_args:
        num_blocks: 4
        N: 2              # n_ifos (H1 + L1)
        ssm_size: 128
        H: 128
        output_dim: 2     # 2 * n_targets (mean + log-var for chirp_mass)
        task: regression
        output_step: 1
        discretization: damped_IMEX
        drop_rate: 0.1
        seed: 42

data:
  class_path: dataloader.LIGO_dataloader.LIGODataModule
  init_args:
    # Pre-cut 58.75-63.25 s window at 2048 Hz (data/LIGO/extract_window.py).
    # Models see 4 s (59-63 s) shifted by up to +-0.25 s: random per item in train, fixed per sample in val/test.
    train_file: data/LIGO/train.h5
    val_file:   data/LIGO/val.h5
    test_file:  data/LIGO/test.h5
    injected_data_key: whitened_injected
    target_variables:
      - chirp_mass
    observed_variables:
      - snr
    strain_frequency:  2048
    strain_duration:   4.5
    window_begin:      0.25
    window_end:        4.25
    jitter:            0.25
    train_batch_size:  64
    val_batch_size:    64
    test_batch_size:   128
    num_workers:       4
    shuffle:           true
