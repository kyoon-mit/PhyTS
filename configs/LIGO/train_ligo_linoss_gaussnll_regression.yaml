# Usage:
#   python main.py fit  --config configs/LIGO/train_ligo_linoss_gaussnll_regression.yaml
#   python main.py test --config configs/LIGO/train_ligo_linoss_gaussnll_regression.yaml \
#                       --ckpt_path checkpoints/ligo_linoss_gaussnll_regression/best.ckpt
#
# LinOSS (JAX/equinox) Gaussian NLL regression: 2-channel strain 59-63 s -> chirp_mass.
# accelerator: cpu — JAX manages its own GPU device via XLA.
# module load cudnn/9.10.2.21_cuda12-fasrc01 required before running.
# ~3.2M parameters (H=512, ssm_size=32, num_blocks=4).

trainer:
  max_epochs: 1000
  accelerator: cpu          # JAX handles GPU directly; Lightning orchestrates on CPU
  devices: 1
  log_every_n_steps: 10
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        mode: min
        patience: 200
        min_delta: 1.0e-5
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/ligo_linoss_gaussnll_regression
        filename: best
        monitor: val/loss
        mode: min
        save_top_k: 1
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: TimeSeriesPhysics
      name: ligo_linoss_gaussnll_regression

model:
  class_path: tasks.LIGO.regression_jax.LinOSSLIGOGaussNLL
  init_args:
    n_targets: 1
    lr: 1.0e-3
    clip_grad_norm: 1.0
    seed: 42
    target_names:
      - chirp_mass
    observed_names:
      - snr
    csv_out: results/LIGO/linoss_gaussnll_regression/test_predictions.csv
    model:
      class_path: models.linoss.LinOSS
      init_args:
        num_blocks: 4
        N: 2              # n_ifos (H1 + L1)
        ssm_size: 32
        H: 512
        output_dim: 2     # 2 * n_targets (mean + log-var for chirp_mass)
        task: regression
        output_step: 1
        discretization: damped_IMEX
        seed: 42

data:
  class_path: dataloader.LIGO_dataloader.LIGODataModule
  init_args:
    train_file: data/LIGO/train/sig_combined_train.h5
    val_file:   data/LIGO/val/sig_combined_val.h5
    test_file:  data/LIGO/test/sig_combined_test.h5
    injected_data_key: whitened_injected
    target_variables:
      - chirp_mass
    observed_variables:
      - snr
    strain_frequency:  256
    strain_duration:   64.0
    window_begin:      59.0
    window_end:        63.0
    train_batch_size:  64
    val_batch_size:    64
    test_batch_size:   128
    num_workers:       4
    shuffle:           true
