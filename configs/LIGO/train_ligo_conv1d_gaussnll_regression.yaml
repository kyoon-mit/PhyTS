# Usage:
#   uv run python main.py fit  --config configs/LIGO/train_ligo_conv1d_gaussnll_regression.yaml
#   uv run python main.py test --config configs/LIGO/train_ligo_conv1d_gaussnll_regression.yaml \
#                              --ckpt_path checkpoints/ligo_conv1d_gaussnll_regression/best.ckpt
#
# ResNet1D GaussNLL regression: 2-channel (H1+L1) strain 59-63 s -> chirp_mass.
# ResNet18-lite (layers=[1,1,1,1], kernel=7) -> comparable to S4D(d_model=512, n_layers=4). ~3.85M params.
# Mirrors ml4gw ResNet1D (aframe LIGO community standard): residual blocks, GroupNorm, channels [64,128,256,512].

trainer:
  max_epochs: 1000
  accelerator: gpu
  devices: 1
  log_every_n_steps: 10
  gradient_clip_val: 1.0
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        mode: min
        patience: 200
        min_delta: 1.0e-5
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/ligo_conv1d_gaussnll_regression
        filename: best
        monitor: val/loss
        mode: min
        save_top_k: 1
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: TimeSeriesPhysics
      name: ligo_conv1d_gaussnll_regression

model:
  class_path: tasks.LIGO.regression.LIGORegressionGaussNLL
  init_args:
    target_names:
      - chirp_mass
    observed_names:
      - snr
    lr: 1.0e-3
    lr_decay: 0.99
    csv_out: results/LIGO/conv1d_gaussnll_regression/test_predictions.csv
    model:
      class_path: models.conv1d_regressor.ResNet1DRegressor
      init_args:
        d_input: 2          # H1 (index 0) + L1 (index 1)
        d_output: 2         # mean + log-var for chirp_mass
        layers: [1, 1, 1, 1]
        kernel_size: 7

data:
  class_path: dataloader.LIGO_dataloader.LIGODataModule
  init_args:
    train_file: data/LIGO/train/sig_combined_train.h5
    val_file:   data/LIGO/val/sig_combined_val.h5
    test_file:  data/LIGO/test/sig_combined_test.h5
    injected_data_key: whitened_injected
    target_variables:
      - chirp_mass
    observed_variables:
      - snr
    strain_frequency:  256
    strain_duration:   64.0
    window_begin:      59.0
    window_end:        63.0
    train_batch_size:  64
    val_batch_size:    64
    test_batch_size:   128
    num_workers:       4
    shuffle:           true
