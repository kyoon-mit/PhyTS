# Usage: python main.py fit --config configs/LIGO/train_ligo_linoss_gaussnll_raw.yaml
# LinOSS (JAX/equinox) regressor: chirp_mass from raw noisy LIGO strain.
# Loss: Gaussian NLL (predicts mean + log-variance).
# Dataset: bns_snr_5_50_powerlaw_256Hz_80K_10K_100K, window 59-63 s (L=1024).

trainer:
  max_epochs: 1000
  accelerator: cpu          # JAX manages its own GPU device; Lightning runs on CPU
  devices: 1
  log_every_n_steps: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        mode: min
        patience: 20
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/ligo_linoss_gaussnll_raw
        filename: best
        monitor: val/loss
        mode: min
        save_top_k: 1
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: TimeSeriesPhysics
      name: ligo_linoss_gaussnll_raw

model:
  class_path: tasks.LIGO.regression_jax.LinOSSLIGOGaussNLL
  init_args:
    n_targets: 1          # chirp_mass only
    lr: 1e-3
    clip_grad_norm: 1.0
    seed: 42
    model:
      class_path: models.linoss.LinOSS
      init_args:
        num_blocks: 4
        N: 2              # n_ifos = H1 + L1
        ssm_size: 64
        H: 256
        output_dim: 2     # 2 * n_targets (mean + log-var for chirp_mass)
        task: regression
        output_step: 1
        discretization: damped_IMEX
        seed: 42

data:
  class_path: dataloader.LIGO_dataloader.LIGODataModule
  init_args:
    train_file: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/ai4gw@cern/bns_snr_5_50_powerlaw_256Hz_80K_10K_100K/train/sig_combined_train.h5
    val_file:   /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/ai4gw@cern/bns_snr_5_50_powerlaw_256Hz_80K_10K_100K/val/sig_combined_val.h5
    test_file:  /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/ai4gw@cern/bns_snr_5_50_powerlaw_256Hz_80K_10K_100K/test/sig_combined_test.h5
    injected_data_key: whitened_injected
    target_variables:
      - chirp_mass
    observed_variables:
      - snr
    strain_frequency:  256
    strain_duration:   64.0
    window_begin:      59.0
    window_end:        63.0
    train_batch_size:  64
    val_batch_size:    64
    test_batch_size:   64
    num_workers:       4
    shuffle:           true
