# Usage: python main.py fit --config configs/LIGO/train_ligo_conv_regression.yaml
# Trains 1D CNN regressor: injected strain (H1+L1) -> chirp_mass.
# Window: 4 s at 512 Hz = 2048 timesteps per sample.

trainer:
  max_epochs: 100
  accelerator: gpu
  devices: 1
  log_every_n_steps: 25
  enable_progress_bar: false
  callbacks:
    - class_path: models.utils.callbacks.LogProgressCallback
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        mode: min
        patience: 10
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/ligo_conv_regression
        filename: best
        monitor: val/loss
        mode: min
        save_top_k: 5
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: TimeSeriesPhysics
      name: ligo_conv_regression

model:
  class_path: tasks.LIGO.regression.RegressionMSE
  init_args:
    lr: 1e-3
    lr_decay: 0.99
    model:
      class_path: models.conv_regressor.Conv1DRegressor
      init_args:
        d_input: 2             # H1 + L1 interferometer channels
        d_output: 1            # number of target variables (chirp_mass)
        channels: [32, 64, 128, 256]
        kernel_size: 7
        pool_stride: 2
        dropout: 0.1

data:
  class_path: dataloader.LIGO_dataloader.LIGODataModule
  init_args:
    train_file: /fast/barmstrong/LIGO/merged/train.h5
    val_file: /fast/barmstrong/LIGO/merged/val.h5
    test_file: /fast/barmstrong/LIGO/merged/test.h5
    target_variables:
      - chirp_mass
    observed_variables:
      - snr
    injected_data_key: whitened_injected
    strain_frequency: 512
    downsample_factor: 1
    strain_duration: 32.0
    window_begin: 28.0
    window_end: 32.0
    train_batch_size: 64
    val_batch_size: 64
    test_batch_size: 64
    num_workers: 16
    shuffle: true
    persistent_workers: true
