# Usage:
#   python main.py fit  --config configs/LIGO/train_ligo_s4d_gaussnll_regression.yaml
#   python main.py test --config configs/LIGO/train_ligo_s4d_gaussnll_regression.yaml \
#                       --ckpt_path checkpoints/ligo_s4d_gaussnll_regression/best.ckpt
#
# S4D Gaussian NLL regression: 2-channel (H1+L1) strain 59-63 s at 2048 Hz (8192 steps) -> chirp_mass.
# Loss: Gaussian NLL.  d_output=2 (mean + log-var for chirp_mass).
# ~0.27M parameters (d_model=128, d_state=128, 4 layers).

seed_everything: 42

trainer:
  max_epochs: 60   # fixed 60-epoch budget for every model; test uses the best-val checkpoint
  accelerator: gpu
  devices: 1
  log_every_n_steps: 10
  gradient_clip_val: 1.0
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        mode: min
        patience: 30
        min_delta: 1.0e-5
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/ligo_s4d_gaussnll_regression
        filename: best
        monitor: val/loss
        mode: min
        save_top_k: 1
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: TimeSeriesPhysics
      name: ligo_s4d_gaussnll_regression

model:
  class_path: tasks.LIGO.regression.LIGORegressionGaussNLL
  init_args:
    target_names:
      - chirp_mass
    observed_names:
      - snr
    lr: 3.0e-4
    lr_decay: 0.99
    csv_out: results/LIGO/s4d_gaussnll_regression/test_predictions.csv
    model:
      class_path: models.s4d.S4Model
      init_args:
        d_input: 2          # H1 (index 0) + L1 (index 1)
        d_output: 2         # mean + log-var for chirp_mass
        d_model: 128
        d_state: 128
        n_layers: 4
        dropout: 0.1
        dt_min: 0.001
        dt_max: 0.1

data:
  class_path: dataloader.LIGO_dataloader.LIGODataModule
  init_args:
    # Pre-cut 58.75-63.25 s window at 2048 Hz (data/LIGO/extract_window.py).
    # Models see 4 s (59-63 s) shifted by up to +-0.25 s: random per item in train, fixed per sample in val/test.
    train_file: data/LIGO/2048Hz/train.h5
    val_file:   data/LIGO/2048Hz/val.h5
    test_file:  data/LIGO/2048Hz/test.h5
    injected_data_key: whitened_injected
    target_variables:
      - chirp_mass
    observed_variables:
      - snr
    strain_frequency:  2048
    strain_duration:   4.5
    window_begin:      0.25
    window_end:        4.25
    jitter:            0.25
    train_batch_size:  64
    val_batch_size:    64
    test_batch_size:   128
    num_workers:       4
    shuffle:           true
