# Usage: python main.py fit --config configs/TIDMAD/train_tidmad_mlp_regression_denoised.yaml \
#     --model.init_args.denoiser_ckpt checkpoints/tidmad_{name}/best.ckpt \
#     --model.init_args.denoiser_cfg  configs/TIDMAD/train_tidmad_{name}.yaml \
#     --trainer.callbacks[1].init_args.dirpath checkpoints/tidmad_mlp_regression_denoised_{name} \
#     --trainer.logger.init_args.name tidmad_mlp_regression_denoised_{name}
# Trains MLP regressor on denoiser outputs (frozen denoiser applied on-the-fly).

trainer:
  max_epochs: 1000
  accelerator: gpu
  devices: 1
  log_every_n_steps: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        mode: min
        patience: 10
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/tidmad_mlp_regression_denoised
        filename: best
        monitor: val/loss
        mode: min
        save_top_k: 1
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: TimeSeriesPhysics
      name: tidmad_mlp_regression_denoised

model:
  class_path: tasks.TIDMAD.tidmad_regression.RegressionMSE
  init_args:
    use_clean_input: false
    denoiser_ckpt: null
    denoiser_cfg: null
    target_params:
      - frequency_hz
      - amplitude
    lr: 1.0e-3
    lr_decay: 0.99
    model:
      class_path: models.mlp.MLPRegressor
      init_args:
        seq_len: 100000
        d_output: 2
        hidden_dims: [256, 128, 64]
        dropout: 0.1

data:
  class_path: dataloader.tidmad_dataloader.TIDMADDataModule
  init_args:
    data_dir: data/TIDMAD/preprocessed
    batch_size: 32
    num_workers: 4
