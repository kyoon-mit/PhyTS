# Usage: python main.py fit --config configs/TIDMAD/train_tidmad_mlp_denoiser_denoising_mse.yaml
# Note: seq_len=100000 — first/last FC layer has 100k×64=6.4M weights each.

trainer:
  max_epochs: 100
  accelerator: gpu
  devices: 1
  log_every_n_steps: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        mode: min
        patience: 10
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/tidmad_mlp_denoiser_denoising_mse
        filename: best
        monitor: val/loss
        mode: min
        save_top_k: 1
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: TimeSeriesPhysics
      name: tidmad_mlp_denoiser_denoising_mse

model:
  class_path: tasks.toy.toy_denoising.DenoisingMSE
  init_args:
    lr: 1.0e-3
    lr_decay: 0.99
    model:
      class_path: models.mlp_denoiser.MLPDenoiser
      init_args:
        seq_len: 100000
        hidden_dims: [64, 32, 64]
        dropout: 0.1

data:
  class_path: dataloader.tidmad_dataloader.TIDMADDataModule
  init_args:
    data_dir: data/TIDMAD/preprocessed
    batch_size: 32
    num_workers: 4
