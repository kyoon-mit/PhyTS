# Usage: python main.py fit --config configs/TIDMAD/train_tidmad_s4d_denoising.yaml
# Trains S4D seq2seq denoiser: channel0001 (noisy) -> channel0002 (clean).
# Input: 100,000 samples at 10 MHz (0.01 s, no downsampling). Nyquist = 5 MHz.

trainer:
  max_epochs: 100
  accelerator: gpu
  devices: 1
  log_every_n_steps: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        mode: min
        patience: 10
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/tidmad_s4d_denoising
        filename: best
        monitor: val/loss
        mode: min
        save_top_k: 1
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: logs
      name: tidmad_s4d_denoising

model:
  class_path: tasks.toy.toy_denoising.DenoisingMSE
  init_args:
    lr: 1.0e-3
    lr_decay: 0.99
    model:
      class_path: models.s4d_seq2seq.S4ModelSeq2Seq
      init_args:
        d_input: 1
        d_output: 1
        d_model: 64
        d_state: 16
        n_layers: 4
        dropout: 0.1
        dt_min: 0.001
        dt_max: 0.1

data:
  class_path: dataloader.tidmad_dataloader.TIDMADDataModule
  init_args:
    data_dir: data/TIDMAD/preprocessed
    batch_size: 32
    num_workers: 4
