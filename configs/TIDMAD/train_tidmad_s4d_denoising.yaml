# Usage:
#   python main.py fit  --config configs/TIDMAD/train_tidmad_s4d_denoising.yaml
#   python main.py test --config configs/TIDMAD/train_tidmad_s4d_denoising.yaml \
#                       --ckpt_path checkpoints/tidmad_s4d_denoising/best.ckpt
#
# S4D denoiser: noisy SQUID readout (time_series_ch1) -> injected signal (time_series_ch2),
# 100,000-sample windows at 10 MHz. d_model=128, d_state=64, 6 layers, one output per time step.
# Loss: PSD (MSE between power spectra).

trainer:
  max_epochs: 100
  accelerator: gpu
  devices: 1
  log_every_n_steps: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        mode: min
        patience: 10
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/tidmad_s4d_denoising
        filename: best
        monitor: val/loss
        mode: min
        save_top_k: 1
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: logs
      name: tidmad_s4d_denoising

model:
  class_path: tasks.TIDMAD.pytorch_denoising.TIDMADDenoisingPSD
  init_args:
    lr: 1.0e-3
    lr_decay: 0.99
    model:
      class_path: models.s4d.S4Model
      init_args:
        d_input: 1
        d_output: 1
        d_model: 128
        d_state: 64
        n_layers: 6
        dropout: 0.0
        pool: false

data:
  class_path: dataloader.tidmad_dataloader.TIDMADDataModule
  init_args:
    data_dir: data/TIDMAD/preprocessed
    batch_size: 4
    num_workers: 4
