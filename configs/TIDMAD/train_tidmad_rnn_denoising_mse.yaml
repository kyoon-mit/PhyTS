# Usage: python main.py fit --config configs/TIDMAD/train_tidmad_rnn_denoising_mse.yaml

trainer:
  max_epochs: 100
  accelerator: gpu
  devices: 1
  log_every_n_steps: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        mode: min
        patience: 10
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/tidmad_rnn_denoising_mse
        filename: best
        monitor: val/loss
        mode: min
        save_top_k: 1
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: TimeSeriesPhysics
      name: tidmad_rnn_denoising_mse

model:
  class_path: tasks.TIDMAD.pytorch_denoising.TIDMADDenoisingMSE
  init_args:
    lr: 1.0e-3
    lr_decay: 0.99
    model:
      class_path: models.rnn_seq2seq.RNNSeq2Seq
      init_args:
        d_input: 1
        d_model: 64
        n_layers: 2
        dropout: 0.1

data:
  class_path: dataloader.tidmad_dataloader.TIDMADDataModule
  init_args:
    data_dir: data/TIDMAD/preprocessed
    batch_size: 32
    num_workers: 4
