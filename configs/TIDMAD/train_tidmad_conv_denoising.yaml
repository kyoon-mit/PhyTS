# Usage:
#   python main.py fit  --config configs/TIDMAD/train_tidmad_conv_denoising.yaml
#   python main.py test --config configs/TIDMAD/train_tidmad_conv_denoising.yaml \
#                       --ckpt_path checkpoints/tidmad_conv_denoising/best.ckpt
#
# ConvAE denoiser: noisy SQUID readout (time_series_ch1) -> injected signal (time_series_ch2),
# 100,000-sample windows at 10 MHz. ~191K parameters (5 layers, 64 channels, kernel 9).
# Loss: PSD (MSE between power spectra).

trainer:
  max_epochs: 100
  accelerator: gpu
  devices: 1
  log_every_n_steps: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        mode: min
        patience: 10
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/tidmad_conv_denoising
        filename: best
        monitor: val/loss
        mode: min
        save_top_k: 1
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: logs
      name: tidmad_conv_denoising

model:
  class_path: tasks.TIDMAD.pytorch_denoising.TIDMADDenoisingPSD
  init_args:
    lr: 1.0e-3
    lr_decay: 0.99
    model:
      class_path: models.conv_ae.ConvAE
      init_args:
        n_layers: 5
        latent_channels: 64
        kernel_size: 9
        pool_stride: 2

data:
  class_path: dataloader.tidmad_dataloader.TIDMADDataModule
  init_args:
    data_dir: data/TIDMAD/preprocessed
    batch_size: 4
    num_workers: 4
