# Usage:
#   python main.py fit  --config configs/TIDMAD/train_tidmad_linoss_denoising.yaml
#   python main.py test --config configs/TIDMAD/train_tidmad_linoss_denoising.yaml \
#                       --ckpt_path checkpoints/tidmad_linoss_denoising/best.ckpt
#
# LinOSS denoiser: noisy SQUID readout (time_series_ch1) -> injected signal (time_series_ch2),
# 100,000-sample windows at 10 MHz. ~200K parameters (4 damped-IMEX blocks, H=128, ssm_size=32).
# Loss: PSD (MSE between power spectra).

trainer:
  max_epochs: 100
  accelerator: gpu
  devices: 1
  log_every_n_steps: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        mode: min
        patience: 10
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/tidmad_linoss_denoising
        filename: best
        monitor: val/loss
        mode: min
        save_top_k: 1
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: logs
      name: tidmad_linoss_denoising

model:
  class_path: tasks.TIDMAD.linoss_denoising.TIDMADLinOSSDenoising
  init_args:
    num_blocks: 4
    ssm_size: 32
    H: 128
    discretization: damped_IMEX
    lr: 1.0e-4
    clip_grad_norm: 1.0
    seed: 0

data:
  class_path: dataloader.tidmad_dataloader.TIDMADDataModule
  init_args:
    data_dir: data/TIDMAD/preprocessed
    batch_size: 2
    num_workers: 4
