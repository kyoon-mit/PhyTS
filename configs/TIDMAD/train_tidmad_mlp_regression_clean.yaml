# Usage: python main.py fit --config configs/TIDMAD/train_tidmad_mlp_regression_clean.yaml
# Trains MLP regressor on clean signals (channel0002). This regressor is applied
# to denoised signals at eval time to represent the "denoised pipeline".
# seq_len = 100,000 (0.01 s at 10 MHz, no downsampling)

trainer:
  max_epochs: 1000
  accelerator: gpu
  devices: 1
  log_every_n_steps: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        mode: min
        patience: 10
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/tidmad_mlp_regression_clean
        filename: best
        monitor: val/loss
        mode: min
        save_top_k: 1
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: TimeSeriesPhysics
      name: tidmad_mlp_regression_clean

model:
  class_path: tasks.TIDMAD.tidmad_regression.RegressionMSE
  init_args:
    use_clean_input: true
    target_params:
      - frequency_hz
      - amplitude
    lr: 1.0e-3
    lr_decay: 0.99
    model:
      class_path: models.mlp.MLPRegressor
      init_args:
        seq_len: 100000
        d_output: 2      # must match len(target_params)
        hidden_dims: [256, 128, 64]
        dropout: 0.1

data:
  class_path: dataloader.tidmad_dataloader.TIDMADDataModule
  init_args:
    data_dir: data/TIDMAD/preprocessed
    batch_size: 32
    num_workers: 4
