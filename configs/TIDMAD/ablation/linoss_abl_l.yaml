# LinOSS ablation 'l': blocks=3, ssm_size=64, H=64
# 10-epoch ablation run.
trainer:
  max_epochs: 5
  accelerator: gpu
  devices: 1
  log_every_n_steps: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        mode: min
        patience: 3
    - class_path: models.utils.jax.save_model.JAXCheckpointManager
      init_args:
        monitor: val/loss
        mode: min
        save_top_k: 1
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: logs/ablation
      name: linoss_l

model:
  class_path: tasks.TIDMAD.linoss_denoising.TIDMADLinOSSDenoising
  init_args:
    num_blocks: 3
    ssm_size: 64
    H: 64
    discretization: damped_IMEX
    lr: 1.0e-3
    clip_grad_norm: 1.0
    seed: 0

data:
  class_path: dataloader.tidmad_dataloader.TIDMADDataModule
  init_args:
    data_dir: data/TIDMAD/preprocessed
    batch_size: 2
    num_workers: 4
