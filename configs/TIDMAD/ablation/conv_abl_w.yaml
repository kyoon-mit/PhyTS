# ConvAE ablation 'w': n_layers=3, channels=64, kernel=5
# 10-epoch ablation run.
trainer:
  max_epochs: 5
  accelerator: gpu
  devices: 1
  log_every_n_steps: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        mode: min
        patience: 3
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/ablation/conv_w
        filename: best
        monitor: val/loss
        mode: min
        save_top_k: 1
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: logs/ablation
      name: conv_w

model:
  class_path: tasks.TIDMAD.pytorch_denoising.TIDMADDenoisingMSE
  init_args:
    lr: 1.0e-3
    lr_decay: 0.99
    model:
      class_path: models.conv_ae.ConvAE
      init_args:
        n_layers: 3
        latent_channels: 64
        kernel_size: 5
        pool_stride: 2

data:
  class_path: dataloader.tidmad_dataloader.TIDMADDataModule
  init_args:
    data_dir: data/TIDMAD/preprocessed
    batch_size: 4
    num_workers: 4
