# Usage: python main.py fit --config configs/train_toy.yaml

trainer:
  max_epochs: 100
  accelerator: gpu
  devices: 1
  log_every_n_steps: 1
  logger:
    class_path: lightning.pytorch.loggers.TensorBoardLogger
    init_args:
      save_dir: lightning_logs
      name: toy_denoising

model:
  class_path: tasks.toy_denoising.DenoisingMSE
  init_args:
    lr: 1.0e-3
    lr_decay: 0.99
    model:
      class_path: models.s4d_seq2seq.S4ModelSeq2Seq
      init_args:
        d_input: 1
        d_output: 1
        d_model: 64
        d_state: 16
        n_layers: 2
        dropout: 0.1
        dt_min: 0.001
        dt_max: 0.1

data:
  class_path: dataloader.toy_dataloader.ToyDataModule
  init_args:
    data_dir: data/toy/sinusoidal_signal_white_noise
    batch_size: 64
    num_workers: 4
