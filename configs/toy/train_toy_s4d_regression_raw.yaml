# Usage: python main.py fit --config configs/toy/train_toy_s4d_regression_raw.yaml
# Trains regressor on raw noisy signals (sig_bkg).

trainer:
  max_epochs: 1000
  accelerator: gpu
  devices: 1
  log_every_n_steps: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        mode: min
        patience: 10
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/toy_s4d_regression_raw
        filename: best
        monitor: val/loss
        mode: min
        save_top_k: 1
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: TimeSeriesPhysics
      name: toy_s4d_regression_raw

model:
  class_path: tasks.toy.toy_regression.RegressionMSE
  init_args:
    use_clean_input: false
    target_params:
      - amplitude
      - frequency_hz
      - phase_rad
    lr: 1.0e-3
    lr_decay: 0.99
    model:
      class_path: models.s4d.S4Model
      init_args:
        d_input: 1
        d_output: 3      # must match len(target_params)
        d_model: 64
        d_state: 16
        n_layers: 2
        dropout: 0.1
        dt_min: 0.001
        dt_max: 0.1

data:
  class_path: dataloader.toy_dataloader.ToyDataModule
  init_args:
    data_dir: data/toy/sinusoidal_signal_white_noise
    batch_size: 64
    num_workers: 0
