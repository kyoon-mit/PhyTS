# Base config for regressor trained on denoised signals.
# Denoiser ckpt/cfg are passed as CLI overrides in run.sh:
#   python main.py fit --config configs/toy/train_toy_mlp_regression_denoised.yaml \
#       --model.init_args.denoiser_ckpt checkpoints/toy_<name>/best.ckpt \
#       --model.init_args.denoiser_cfg  configs/toy/train_toy_<name>.yaml \
#       --trainer.callbacks[1].init_args.dirpath checkpoints/toy_mlp_regression_denoised_<name> \
#       --trainer.logger.init_args.name toy_mlp_regression_denoised_<name>

trainer:
  max_epochs: 100
  accelerator: gpu
  devices: 1
  log_every_n_steps: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        mode: min
        patience: 10
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/toy_mlp_regression_denoised
        filename: best
        monitor: val/loss
        mode: min
        save_top_k: 1
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: TimeSeriesPhysics
      name: toy_mlp_regression_denoised

model:
  class_path: tasks.toy.toy_regression.RegressionMSE
  init_args:
    use_clean_input: false
    denoiser_ckpt: null
    denoiser_cfg: null
    target_params:
      - amplitude
      - frequency_hz
      - phase_rad
    lr: 1.0e-3
    lr_decay: 0.99
    model:
      class_path: models.mlp.MLPRegressor
      init_args:
        seq_len: 640
        d_output: 3
        hidden_dims: [256, 128, 64]
        dropout: 0.1

data:
  class_path: dataloader.toy_dataloader.ToyDataModule
  init_args:
    data_dir: data/toy/sinusoidal_signal_white_noise
    batch_size: 64
    num_workers: 4
