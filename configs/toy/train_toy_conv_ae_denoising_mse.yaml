# Usage: python main.py fit --config configs/toy/train_toy_conv_ae_denoising_mse.yaml

trainer:
  max_epochs: 100
  accelerator: gpu
  devices: 1
  log_every_n_steps: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        mode: min
        patience: 10
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/toy_conv_ae_denoising_mse
        filename: best
        monitor: val/loss
        mode: min
        save_top_k: 1
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: TimeSeriesPhysics
      name: toy_conv_ae_denoising_mse

model:
  class_path: tasks.toy.toy_denoising.DenoisingMSE
  init_args:
    lr: 1.0e-3
    lr_decay: 0.99
    model:
      class_path: models.conv_ae.ConvAE
      init_args:
        n_layers: 3
        latent_channels: 32
        kernel_size: 5
        pool_stride: 2

data:
  class_path: dataloader.toy_dataloader.ToyDataModule
  init_args:
    data_dir: data/toy/sinusoidal_signal_white_noise
    batch_size: 64
    num_workers: 4
