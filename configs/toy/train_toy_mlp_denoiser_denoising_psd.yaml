# Usage: python main.py fit --config configs/toy/train_toy_mlp_denoiser_denoising_psd.yaml

trainer:
  max_epochs: 100
  accelerator: gpu
  devices: 1
  log_every_n_steps: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        mode: min
        patience: 10
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/toy_mlp_denoiser_denoising_psd
        filename: best
        monitor: val/loss
        mode: min
        save_top_k: 1
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: TimeSeriesPhysics
      name: toy_mlp_denoiser_denoising_psd

model:
  class_path: tasks.toy.toy_denoising.DenoisingPSD
  init_args:
    lr: 1.0e-3
    lr_decay: 0.99
    model:
      class_path: models.mlp_denoiser.MLPDenoiser
      init_args:
        seq_len: 640
        hidden_dims: [512, 256, 512]
        dropout: 0.1

data:
  class_path: dataloader.toy_dataloader.ToyDataModule
  init_args:
    data_dir: data/toy/sinusoidal_signal_white_noise
    batch_size: 64
    num_workers: 4
