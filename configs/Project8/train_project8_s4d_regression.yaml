# Usage: python main.py fit --config configs/Project8/train_project8_s4d_regression.yaml
# Trains an S4D regressor on Project 8 I/Q traces -> energy_eV.

trainer:
  max_epochs: 50
  accelerator: gpu
  devices: 1
  log_every_n_steps: 10
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        mode: min
        patience: 10
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/project8_s4d_regression
        filename: best
        monitor: val/loss
        mode: min
        save_top_k: 1

model:
  class_path: tasks.Project8.regression.RegressionMSE
  init_args:
    target_params: [energy_eV]
    lr: 1.0e-3
    lr_decay: 0.99
    model:
      class_path: models.s4d.S4Model
      init_args:
        d_input: 2
        d_output: 1
        d_model: 128
        d_state: 64
        n_layers: 4
        dropout: 0.1

data:
  class_path: dataloader.project8_dataloader.Project8DataModule
  init_args:
    train_dir: data/Project8/train
    val_dir:   data/Project8/val
    test_dir:  data/Project8/test
    inputs:    [output_ts_I, output_ts_Q]
    variables: [energy_eV]
    cutoff:    24576         # full trace length
    noise_type: cav          # canonical (calibrated cavity noise); 'gauss' = safety baseline
    freq_transform: null     # null = time-series; 'fft' = frequency-domain
    batch_size: 32
    num_workers: 4
