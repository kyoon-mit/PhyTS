# Usage:
#   python main.py fit --config configs/Project8/train_project8_transformer_regression_energy_gaussiannll.yaml
#
# Regress energy_eV from cav-noised I/Q time series via FFT input, with
# GaussianNLL loss, using a vanilla Transformer encoder (TransformerClassifier).
# Mirrors the S4D/CNN Project 8 GaussianNLL configs but swaps the encoder.
#
# Note: attention is O(L^2) so memory grows quickly with cutoff/batch_size.
# At cutoff=8192 we use a smaller batch_size (16) and rely on PyTorch's
# scaled_dot_product_attention for flash-attention kernels on CUDA.

trainer:
  max_epochs: 100
  accelerator: gpu
  devices: 1
  log_every_n_steps: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        mode: min
        patience: 20
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/project8_transformer_regression_energy_gaussiannll
        filename: best
        monitor: val/loss
        mode: min
        save_top_k: 1
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: TimeSeriesPhysics
      name: project8_transformer_regression_energy_gaussiannll

model:
  class_path: tasks.Project8.project8_regression.Project8Regression
  init_args:
    learning_rate: 1.0e-4
    gamma: 0.25
    lr_patience: 5
    threshold: 1.0e-3
    lr_min: 1.0e-6
    encoder:
      class_path: models.transformer.TransformerClassifier
      init_args:
        seq_len:         8192
        d_input:         2          # FFT real/imag channels
        d_output:        2          # [mean, raw_var] for energy_eV
        d_model:         128
        nhead:           4
        num_layers:      4
        dim_feedforward: 256
        dropout:         0.1

data:
  class_path: dataloader.project8_dataloader.Project8DataModule
  init_args:
    train_dir: /n/holystore01/LABS/iaifi_lab/Users/creissel/Project8/train
    val_dir:   /n/holystore01/LABS/iaifi_lab/Users/creissel/Project8/valid
    test_dir:  /n/holystore01/LABS/iaifi_lab/Users/creissel/Project8/test
    inputs:    [output_ts_I, output_ts_Q]
    variables: [energy_eV]
    cutoff:    8192
    norm:      true
    noise_type: cav
    freq_transform: fft
    batch_size: 16
    num_workers: 4
