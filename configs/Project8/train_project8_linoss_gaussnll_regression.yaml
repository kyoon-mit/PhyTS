# Usage:
#   python main.py fit  --config configs/Project8/train_project8_linoss_gaussnll_regression.yaml
#   python main.py test --config configs/Project8/train_project8_linoss_gaussnll_regression.yaml \
#                       --ckpt_path checkpoints/project8_linoss_gaussnll_regression/best.ckpt
#
# LinOSS Gaussian-NLL energy regression: cavity-noise I/Q (24,576 samples) -> energy_eV
# mean and variance. ~400K parameters (6 damped-IMEX blocks, H=128, ssm_size=64). Needs
# ~83 GB of GPU memory at batch 64 (42 GB at 32); lower batch_size on smaller GPUs.

trainer:
  max_epochs: 100
  accelerator: gpu
  devices: 1
  log_every_n_steps: 10
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        mode: min
        patience: 20
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/project8_linoss_gaussnll_regression
        filename: best
        monitor: val/loss
        mode: min
        save_top_k: 1
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: logs
      name: project8_linoss_gaussnll_regression

model:
  class_path: tasks.Project8.regression_jax.LinOSSProject8Regression
  init_args:
    lr: 1.0e-3
    clip_grad_norm: 1.0
    seed: 0
    csv_out: results/Project8/linoss_gaussnll_regression/test_predictions.csv
    model:
      class_path: models.linoss.LinOSS
      init_args:
        num_blocks: 6
        N: 2                # I, Q
        ssm_size: 64
        H: 128
        output_dim: 2       # mean, raw variance
        task: regression
        output_step: 1
        discretization: damped_IMEX
        seed: 0

data:
  class_path: dataloader.project8_dataloader.Project8DataModule
  init_args:
    data_dir: data/Project8
    target: energy_eV
    noise_type: cav
    cutoff: 24576
    batch_size: 64
    num_workers: 4
