# Usage:
#   python main.py fit  --config configs/Project8/train_project8_s4d_gaussnll_regression.yaml
#   python main.py test --config configs/Project8/train_project8_s4d_gaussnll_regression.yaml \
#                       --ckpt_path checkpoints/project8_s4d_gaussnll_regression/best.ckpt
#
# S4D Gaussian-NLL energy regression: cavity-noise I/Q (24,576 samples) -> energy_eV
# mean and variance. ~300K parameters (d_model=128, 6 layers). Needs ~64 GB of GPU memory
# at batch 64; lower batch_size on smaller GPUs.

trainer:
  max_epochs: 100
  accelerator: gpu
  devices: 1
  log_every_n_steps: 10
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        mode: min
        patience: 20
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/project8_s4d_gaussnll_regression
        filename: best
        monitor: val/loss
        mode: min
        save_top_k: 1
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: logs
      name: project8_s4d_gaussnll_regression

model:
  class_path: tasks.Project8.regression.Project8Regression
  init_args:
    lr: 1.0e-3
    lr_factor: 0.25
    lr_patience: 5
    lr_threshold: 1.0e-3
    lr_min: 1.0e-6
    csv_out: results/Project8/s4d_gaussnll_regression/test_predictions.csv
    model:
      class_path: models.s4d.S4Model
      init_args:
        d_input: 2          # I, Q
        d_output: 2         # mean, raw variance
        d_model: 128
        n_layers: 6
        dropout: 0.0

data:
  class_path: dataloader.project8_dataloader.Project8DataModule
  init_args:
    data_dir: data/Project8
    target: energy_eV
    noise_type: cav
    cutoff: 24576
    batch_size: 64
    num_workers: 4
